<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F3F1E8">
    <title>BeerRun · Route Stamp preview</title>
    <script>
      (() => {
        const key = "beer_run_revamp_theme_preference";
        const saved = localStorage.getItem(key);
        const preference = ["system", "light", "dark"].includes(saved) ? saved : "system";
        const resolved = preference === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
    <link rel="stylesheet" href="/revamp-assets/css/foundation.css?v=revamp-021-19">
    <script type="module" src="/revamp-assets/js/app.js?v=revamp-021-19"></script>
  </head>
  <body>
    <div class="app-shell" data-revamp-preview>
      <header class="app-header">
        <a class="product-identity" href="#run" data-destination="run" aria-label="BeerRun run home">
          <span class="product-mark" aria-hidden="true">B</span>
          <span class="product-wordmark">BeerRun</span>
        </a>
        <button class="run-switcher" type="button" data-run-switcher aria-label="Selected run. Open run library">
          <span class="run-switcher__copy"><strong data-run-name>Loading run...</strong><span data-run-meta>Loading current run</span></span>
          <span class="icon icon--caret-down" aria-hidden="true"></span>
        </button>
      </header>

      <div class="shell-body">
        <aside class="desktop-sidebar" aria-label="Desktop application navigation">
          <nav class="primary-navigation" aria-label="Primary">
            <a class="nav-item is-current" href="#run" data-destination="run" aria-current="page"><span class="icon icon--house" aria-hidden="true"></span><span>Run</span></a>
            <a class="nav-item" href="#standings" data-destination="standings"><span class="icon icon--trophy" aria-hidden="true"></span><span>Standings</span></a>
            <a class="nav-item nav-item--log" href="#log" data-destination="log"><span class="icon icon--plus" aria-hidden="true"></span><span>Log</span></a>
            <a class="nav-item" href="#map" data-destination="map"><span class="icon icon--map" aria-hidden="true"></span><span>Map</span></a>
            <a class="nav-item" href="#you" data-destination="you"><span class="icon icon--user" aria-hidden="true"></span><span>You</span></a>
          </nav>
          <div class="desktop-sidebar__footer sync-controls">
            <p class="sync-status" data-sync-status role="status" aria-live="polite">Loading run data</p>
            <button class="button button--quiet refresh-button" type="button" data-refresh><span class="icon icon--refresh" aria-hidden="true"></span><span>Refresh</span></button>
          </div>
        </aside>

        <main class="main-content" id="run" tabindex="-1">
          <div class="home-content" data-run-home data-home-state="loading">
            <section class="ticket-surface home-skeleton home-skeleton--identity" aria-label="Loading run home">
              <span class="skeleton-line skeleton-line--eyebrow"></span>
              <span class="skeleton-line skeleton-line--heading"></span>
              <span class="skeleton-line skeleton-line--copy"></span>
            </section>
          </div>
        </main>
      </div>

      <footer class="mobile-footer">
        <div class="mobile-sync sync-controls">
          <p class="sync-status" data-sync-status role="status" aria-live="polite">Loading run data</p>
          <button class="button button--quiet refresh-button" type="button" data-refresh><span class="icon icon--refresh" aria-hidden="true"></span><span>Refresh</span></button>
        </div>
        <nav class="mobile-navigation" aria-label="Primary">
          <a class="nav-item is-current" href="#run" data-destination="run" aria-current="page"><span class="icon icon--house" aria-hidden="true"></span><span>Run</span></a>
          <a class="nav-item" href="#standings" data-destination="standings"><span class="icon icon--trophy" aria-hidden="true"></span><span>Standings</span></a>
          <a class="nav-item nav-item--log" href="#log" data-destination="log"><span class="icon icon--plus" aria-hidden="true"></span><span>Log</span></a>
          <a class="nav-item" href="#map" data-destination="map"><span class="icon icon--map" aria-hidden="true"></span><span>Map</span></a>
          <a class="nav-item" href="#you" data-destination="you"><span class="icon icon--user" aria-hidden="true"></span><span>You</span></a>
        </nav>
      </footer>
    </div>
  </body>
</html>
