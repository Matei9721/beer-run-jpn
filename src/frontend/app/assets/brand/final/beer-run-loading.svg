<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 244" role="img" aria-labelledby="beer-run-loading-title beer-run-loading-description">
  <title id="beer-run-loading-title">BeerRun loading</title>
  <desc id="beer-run-loading-description">A capital B shaped beer vessel fills with golden beer.</desc>
  <style>
    .beer-run-loading__liquid {
      animation: beer-run-loading-fill 3.2s cubic-bezier(.16, 1, .3, 1) infinite;
      transform: translateY(168px);
    }
    .beer-run-loading__liquid-wrap {
      animation: beer-run-loading-reset 3.2s linear infinite;
    }
    @keyframes beer-run-loading-fill {
      0%, 10% { transform: translateY(168px); }
      70%, 84% { transform: translateY(0); }
      84.01%, 100% { transform: translateY(168px); }
    }
    @keyframes beer-run-loading-reset {
      0%, 78% { opacity: 1; }
      84%, 92% { opacity: 0; }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .beer-run-loading__liquid,
      .beer-run-loading__liquid-wrap { animation: none; }
      .beer-run-loading__liquid { transform: translateY(58px); }
    }
  </style>
  <defs>
    <path id="beer-run-loading-vessel" fill-rule="evenodd" d="M38 66C38 52 49 41 64 40C69 22 87 14 103 23C115 8 139 11 148 29C162 27 176 37 180 52C190 60 195 73 195 88C195 108 186 123 169 133C189 141 201 159 201 181C201 217 172 237 126 237H38V66ZM81 76V119H111C130 119 141 111 141 97C141 83 130 76 111 76H81ZM81 153V201H118C139 201 151 192 151 177C151 162 139 153 118 153H81Z"/>
    <clipPath id="beer-run-loading-clip">
      <use href="#beer-run-loading-vessel"/>
    </clipPath>
  </defs>

  <use href="#beer-run-loading-vessel" fill="#FFF9EA"/>
  <g clip-path="url(#beer-run-loading-clip)">
    <g class="beer-run-loading__liquid-wrap">
      <g class="beer-run-loading__liquid">
        <rect x="20" y="73" width="196" height="185" fill="#F4AA27"/>
        <path fill="#FFF0D2" d="M20 75V48H216V73C202 71 194 77 181 75C169 73 163 88 149 89C132 91 126 72 109 73C92 74 88 91 72 94C55 97 43 84 20 87V75Z"/>
        <path d="M59 111V192" fill="none" stroke="#FFD66E" stroke-linecap="round" stroke-width="8" opacity=".68"/>
      </g>
    </g>
  </g>
  <use href="#beer-run-loading-vessel" fill="none" stroke="#132C25" stroke-linejoin="round" stroke-width="10"/>
</svg>
