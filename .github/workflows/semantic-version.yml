name: Semantic version tags

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create the next semantic version tag
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail

          commit_message="$(git show -s --format=%B "$MERGE_SHA")"

          if grep -Eq '(^[[:alpha:]]+(\([^)]*\))?!:)|(^BREAKING[ -]CHANGE:)' <<< "$commit_message"; then
            bump=major
          elif grep -Eq '^feat(\([^)]*\))?:' <<< "$commit_message"; then
            bump=minor
          else
            bump=patch
          fi

          # A retry makes simultaneous PR merges safe: if another run claims the
          # same tag first, refresh the tags and calculate the next version.
          for attempt in {1..5}; do
            git fetch origin --tags --force
            mapfile -t version_tags < <(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname)
            latest_tag="${version_tags[0]:-}"
            latest_version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "${latest_version:-0.0.0}"

            case "$bump" in
              major) next_version="$((major + 1)).0.0" ;;
              minor) next_version="$major.$((minor + 1)).0" ;;
              patch) next_version="$major.$minor.$((patch + 1))" ;;
            esac

            next_tag="v$next_version"
            git tag -a "$next_tag" "$MERGE_SHA" -m "Release $next_tag"

            if git push origin "refs/tags/$next_tag"; then
              echo "Created $next_tag from $MERGE_SHA using a $bump bump."
              exit 0
            fi

            git tag -d "$next_tag"
            sleep "$attempt"
          done

          echo "Unable to create a unique semantic version tag after 5 attempts." >&2
          exit 1
