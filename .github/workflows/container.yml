name: Test and publish container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --no-sync pytest

  container:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: beer-run:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke test container with disposable state
        shell: bash
        run: bash deploy/smoke-test.sh beer-run:ci
      - name: Publish the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          docker tag beer-run:ci "$IMAGE:latest"
          docker tag beer-run:ci "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
