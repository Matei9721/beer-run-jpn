name: beer-run

services:
  beer-run:
    image: ${BOOZERUN_IMAGE:-ghcr.io/matei9721/beer-run-jpn:latest}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0
    environment:
      # Existing Caddy container's reserved address on caddy-net.
      FORWARDED_ALLOW_IPS: 172.23.0.100
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - type: bind
        source: ./state
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ./app.env
        target: /run/secrets/beer-run.env
        read_only: true
        bind:
          create_host_path: false
    networks:
      caddy-net:
        aliases: [beer-run]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy-net:
    external: true
